<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>OpenPen Anno Text</title>
  </head>
  <body>
    <main id="card">
      <textarea
        id="input"
        rows="2"
        spellcheck="false"
        autocapitalize="off"
        autocomplete="off"
        maxlength="500"
        placeholder="Type your note…"
      ></textarea>
      <footer>
        <span id="hint">Enter adds · Shift+Enter = new line · Esc cancels</span>
        <button id="add" type="button">Add</button>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
